services:
  xhs:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - target: 8787
        published: 8787
        protocol: tcp
        host_ip: 0.0.0.0
      - target: 8790
        published: 8790
        protocol: tcp
        host_ip: 0.0.0.0
    environment:
      XHS_DATA_DIR: /data
      XHS_API_HOST: 0.0.0.0
      XHS_API_PORT: "8787"
      XHS_CONSOLE_HOST: 0.0.0.0
      XHS_CONSOLE_PORT: "8790"
    volumes:
      - xhs-data:/data
    restart: unless-stopped

volumes:
  xhs-data:
